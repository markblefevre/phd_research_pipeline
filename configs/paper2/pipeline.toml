[run]
paper = "paper2"
run_id = "auto"

[stages]
edinet_download = false
mdna_extract = false
longitudinal_match = false
text_tokenization = false
textual_novelty = false
novelty_plots = false
analysis_panel = false
# We ran a standalone LMMD QC check
lmmd_sentiment = false
lmmd_plots = false
financial_bert_sentiment = false
financial_bert_plots = false
llm_sentiment = false
llm_plots = true
market_reaction_eligibility = false
market_reaction_event_dates = false
market_reaction_topix = false
market_reaction_market_model = false
market_reaction_abnormal_returns = false
market_reaction_final_table = false
empirical_panel = false
baseline_regressions = false

## STAGE 1 EDINET_DOWNLOAD
[edinet_download]
api_key_env = "EDINET_API_KEY"

# 有価証券報告書 / Annual Securities Report
doc_type_code = "120"

# Only 10 year lookback through API
start_date = "2016-09-01"
end_date   = "2026-09-19"

# Blank means broad EDINET universe.
# We filter the research sample downstream.
edinet_codes_csv = ""

raw_dir = "data/raw/paper2/edinet"
metadata_csv = "data/interim/paper2/edinet/filings.csv"

skip_if_exists = true
resume = true
retries = 3
request_sleep_seconds = 0.5

download_zip = true
download_pdf = false
download_csv = false

## STAGE 2 MDNA_EXTRACT
[mdna_extract]
raw_dir = "data/raw/paper2/edinet"
output_dir = "data/interim/paper2/mdna"
manifest = "data/interim/paper2/mdna/extraction_manifest.csv"
checkpoint_every = 100
progress_every = 100
retry_failures = false

## STAGE 3 LONGITUDINAL_MATCH
[longitudinal_match]
output_dir = "data/interim/paper2/longitudinal"

# Valid consecutive annual reports should be approximately one year apart.
# Pairs outside this window are written to irregular_period_pairs.csv for review
# rather than silently included in the novelty sample.
min_period_end_gap_days = 300
max_period_end_gap_days = 430

## STAGE 4 MDNA_TOKENIZE
[text_tokenization]
output_dir = "data/interim/paper2/tokens"
max_workers = 8 # Seems to be sweet spot for M1Max
overwrite = false
# Following are optional, allow use of local SSD for speed
source_root = "~/paper2_stage4/mdna"
work_output_dir = "~/paper2_stage4/tokens"
variants = ["sudachi_a_raw", "sudachi_b_raw", "sudachi_c_raw"]
derive_num_variants = true
run_qc = true

## STAGE 5 TEXTUAL_NOVELTY
[textual_novelty]
output_dir = "data/interim/paper2/novelty"
source_root = "~/paper2_stage4/tokens"
mdna_source_root = "~/paper2_stage2/mdna"
work_output_dir = "~/paper2_stage5/novelty"
baseline_variant = "sudachi_c_num"
min_df = 2
max_df = 1.0
ngram_min = 1
ngram_max = 1
sublinear_tf = false
variants = ["sudachi_a_raw", "sudachi_b_raw", "sudachi_c_raw",
    "sudachi_a_num", "sudachi_b_num", "sudachi_c_num"]


## STAGE 5 VISUALIZATION / QC
[novelty_plots]
# Defaults to textual_novelty.work_output_dir when omitted.
source_root = "~/paper2_stage5/novelty"
output_dir = "outputs/paper2/figures/novelty"
baseline_variant = "sudachi_c_num"
raw_variant = "sudachi_c_raw"
formats = ["png", "pdf"]
# Avoid sparse boundary-year publication plots without hard-coding years.
min_year_observations = 25


## STAGE 6A ANALYSIS PANEL
[analysis_panel]
# Stage 6A joins the frozen Stage 3 pair manifest to the primary/robustness
# Stage 5 novelty measures and pair-level length diagnostics.
novelty_source_root = "~/paper2_stage5/novelty"
output_csv = "data/interim/paper2/analysis/analysis_panel.csv"
baseline_variant = "sudachi_c_num"
raw_variant = "sudachi_c_raw"


## STAGE 6B LMMD SENTIMENT
[lmmd_sentiment]
# Production scoring preserves the Paper 1 translated-LMMD methodology but
# consumes the frozen Stage 4 Sudachi C raw tokens rather than retokenizing MD&A.
variant = "sudachi_c_raw"
token_root = "~/paper2_stage4/tokens"
lmmd_dict_csv = "data/curated/paper1/lmmd/Loughran-McDonald_MasterDictionary_GPT_20251229_v2.csv"
token_col = "GPT_JA"
output_csv = "data/interim/paper2/sentiment/lmmd/lmmd_sentiment.csv"
## STAGE 6B LMMD VISUALIZATION / QC
[lmmd_plots]
output_dir = "outputs/paper2/figures/sentiment/lmmd"
formats = ["png", "pdf"]
min_year_observations = 25

# STAGE 6C — JAPANESE FINANCIAL BERT SENTIMENT
[financial_bert_sentiment]
backbone_model = "izumi-lab/bert-base-japanese-fin-additional"

# REQUIRED. These are separate binary classifiers fine-tuned on chABSA from
# the Izumi financial BERT backbone, following Nakatsuka & Suimon (2024).
positive_model = "models/paper2/financial_bert_sentiment/positive/final"
negative_model = "models/paper2/financial_bert_sentiment/negative/final"

# Stage 4 defines the exact same 37,473-document research universe. BERT then
# re-reads original MD&A text and applies the backbone's own Japanese tokenizer.
universe_variant = "sudachi_c_raw"

# Optional local SSD copy for fast small-file I/O. Remove to fall back to
# [mdna_extract].output_dir.
source_root = "~/paper2_stage4/mdna"

output_csv = "data/interim/paper2/sentiment/financial_bert/financial_bert_sentiment.csv"

# Sentence-level scoring matches the chABSA fine-tuning task. Overlong source
# sentences are split into model pieces and re-aggregated before classification;
# they are never silently truncated.
min_chars = 2
max_length = 512
threshold = 0.5

# Tune these for the machine. On Apple Silicon, auto selects MPS if available.
inference_batch_size = 32
document_block_size = 16
device = "auto"
resume = true
overwrite = false

# Optional smoke-test limiter; leave commented for production.
# max_documents = 100

# Normally inferred from Paper 2 checkpoints (0=absent, 1=present).
# Configure all four only for external checkpoints with generic label names.
# positive_absent_id = 0
# positive_present_id = 1
# negative_absent_id = 0
# negative_present_id = 1

[financial_bert_plots]
output_dir = "outputs/paper2/figures/sentiment/financial_bert"
formats = ["pdf", "png"]
dpi = 180
min_year_observations = 25
# If [lmmd_sentiment].output_csv is not available in config, set explicitly:
# lmmd_csv = "data/interim/paper2/sentiment/lmmd/lmmd_sentiment.csv"

## STAGE 6D LLM SENTIMENT
[llm_sentiment]
source_root = "~/paper2_stage4/mdna"
# Production universe should come from the frozen Stage 4 manifest.
manifest_csv = "data/interim/paper2/tokens/sudachi_c_raw/manifest.csv"
prompt_file = "configs/paper2/prompts/llm_sentiment_v2.md"
model = "gpt-6-sol"
reasoning_effort = "none"
target_unit_chars = 1050
max_unit_chars = 1400
min_narrative_line_chars = 20
output_csv = "data/interim/paper2/sentiment/llm/llm_sentiment.csv"
raw_units_dir = "data/interim/paper2/sentiment/llm/units"
resume = true
overwrite = false
dry_run = false
max_retries = 3
retry_base_seconds = 2.0
# Optional integration-test limiter:
#max_documents = 2000
max_concurrent_requests = 8

## STAGE 6D LLM VISUALIZATION / QC
[llm_plots]
output_dir = "outputs/paper2/figures/sentiment/llm"
formats = ["pdf", "png"]
dpi = 180
min_year_observations = 25

## STAGE 7A MARKET-REACTION EVENT ELIGIBILITY
[market_reaction_eligibility]
output_dir = "data/interim/paper2/market_reaction"
skip_if_exists = false

## STAGE 7B MARKET-REACTION EVENT DATES
[market_reaction_event_dates]
input_path = "data/interim/paper2/market_reaction/stage7_event_eligibility.csv"
price_dir = "data/raw/paper2/prices"
output_dir = "data/interim/paper2/market_reaction"
expected_eligible_events = 32126 # 32134 before explicit PRO exclusion addition

[market_reaction_topix]
event_dates_path = "data/interim/paper2/market_reaction/stage7_event_dates.csv"
raw_path = "data/raw/paper2/market/topix_daily.csv"
output_path = "data/interim/paper2/market_reaction/topix_returns.csv"
summary_path = "data/interim/paper2/market_reaction/topix_returns_summary.json"
start = "2016-09-28"
end = "2026-09-25"
api_key_env = "JQUANTS_API_KEY"
refresh_raw = false

## STAGE 7D EVENT-SPECIFIC MARKET MODEL
[market_reaction_market_model]
event_dates_csv = "data/interim/paper2/market_reaction/stage7_event_dates.csv"
topix_returns_csv = "data/interim/paper2/market_reaction/topix_returns.csv"
prices_dir = "data/raw/paper2/prices"
output_csv = "data/interim/paper2/market_reaction/market_model_estimates.csv"
summary_json = "data/interim/paper2/market_reaction/market_model_summary.json"
estimation_start = -120
estimation_end = -20
min_observations = 60

## STAGE 7E ABNORMAL RETURNS / CAR
[market_reaction_abnormal_returns]
event_dates_csv = "data/interim/paper2/market_reaction/stage7_event_dates.csv"
market_model_csv = "data/interim/paper2/market_reaction/market_model_estimates.csv"
topix_returns_csv = "data/interim/paper2/market_reaction/topix_returns.csv"
prices_dir = "data/raw/paper2/prices"
output_csv = "data/interim/paper2/market_reaction/abnormal_returns.csv"
summary_json = "data/interim/paper2/market_reaction/abnormal_returns_summary.json"
windows = [[0,0], [0,1], [-1,1]]

## STAGE 7F FINAL MARKET-REACTION TABLE / QC
[market_reaction_final_table]
analysis_panel_csv = "data/interim/paper2/analysis/analysis_panel.csv"
eligibility_csv = "data/interim/paper2/market_reaction/stage7_event_eligibility.csv"
abnormal_returns_csv = "data/interim/paper2/market_reaction/abnormal_returns.csv"
output_csv = "data/interim/paper2/market_reaction/final_event_study_table.csv"
summary_json = "data/interim/paper2/market_reaction/final_event_study_summary.json"
windows = [[0,0], [0,1], [-1,1]]

## STAGE 8A EMPIRICAL PANEL
[empirical_panel]
analysis_panel_csv = "data/interim/paper2/analysis/analysis_panel.csv"
lmmd_csv = "data/interim/paper2/sentiment/lmmd/lmmd_sentiment.csv"
financial_bert_csv = "data/interim/paper2/sentiment/financial_bert/financial_bert_sentiment.csv"
event_study_csv = "data/interim/paper2/market_reaction/final_event_study_table.csv"
output_csv = "data/interim/paper2/analysis/empirical_panel.csv"
summary_json = "data/interim/paper2/analysis/empirical_panel_summary.json"

## STAGE 8B BASELINE REGRESSIONS
[baseline_regressions]
input_csv = "data/interim/paper2/analysis/empirical_panel.csv"
output_dir = "data/interim/paper2/regressions/baseline"
windows = [[0,0], [0,1], [-1,1]]
novelty_column = "noveltyCNum"
length_control = "absLogLengthChange"
sentiment_models = ["lmmd", "financial_bert"]
include_year_fixed_effects = true
include_industry_fixed_effects = false
cluster_by_firm = true