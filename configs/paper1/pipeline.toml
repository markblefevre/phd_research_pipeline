[run]
paper = "paper1"
run_id = "auto"   # auto = driver fills timestamp

[stages]
price_data = false
price_features = false
market_indexes = false
lmmd_score = false
build_panel = false
market_model = false
car_computation = true
horserace = false

[price_data]
skip_if_exists    = true
symbols_csv       = "data/curated/paper1/universe/nikkei225_all.csv"
symbols_col       = "symbol"
stocks_out_csv    = "data/curated/paper1/prices/prices_long.csv"
dividends_out_csv = "data/curated/paper1/prices/dividends.csv"
splits_out_csv    = "data/curated/paper1/prices/splits.csv"
start             = "2015-01-01"
end               = ""
# Could add chunk_size, retries

[price_features]
skip_if_exists    = true
input_csv         = "data/curated/paper1/prices/prices_long.csv"
output_csv        = "data/curated/paper1/prices/price_features.csv"
price_col         = "adj_close"
symbol_col        = "symbol"
date_col          = "date"
return_col        = "ret"
offset            = 11
windows           = [20, 60, 120]
ddof              = 1

[market_indexes]
skip_if_exists    = true
topix_out_csv     = "data/curated/paper1/prices/TOPIX_prices.csv"
n225_out_csv      = "data/curated/paper1/prices/N225_prices.csv"
topix_source      = "jpx"
start             = "2016-03-15"
end               = ""

[lmmd_score]
skip_if_exists   = true
index_csv        = "data/curated/paper1/panel/mdna_summary_nikkei225_filtered.csv"
mdna_dir         = "data/interim/paper1/data"                
lmmd_dict_csv    = "data/curated/paper1/lmmd/Loughran-McDonald_MasterDictionary_GPT_20251229_v2.csv"
out_csv          = "data/curated/paper1/panel/lmmd_scores_nikkei225.csv"

[build_panel]
skip_if_exists     = true
gpt_csv            = "data/curated/paper1/panel/mdna_summary_nikkei225_filtered.csv"
lmmd_csv           = "data/curated/paper1/panel/lmmd_scores_nikkei225.csv"
fundamentals_csv   = "data/curated/paper1/panel/edinet_fundamentals_from_xbrl.csv"
price_features_csv = "data/curated/paper1/prices/price_features.csv"
out_csv            = "data/curated/paper1/panel/mdna_summary_nikkei225_with_lmmd.csv"

[market_model]
skip_if_exists   = false
panel_csv        = "data/curated/paper1/panel/mdna_summary_nikkei225_with_lmmd.csv"
market_csv       = "data/curated/paper1/prices/TOPIX_prices.csv"
stocks_csv       = "data/curated/paper1/prices/prices_long.csv"
out_csv          = "data/curated/paper1/event_study/alphas_betas.csv"

[car_computation]
windows          = [[0,0],[0,1],[-1,1],[-2,2],[-3,3]]
skip_if_exists   = true
[car_computation.inputs]
sentiment_csv    = "data/curated/paper1/panel/mdna_summary_nikkei225_with_lmmd.csv"
alphas_betas_csv = "data/curated/paper1/event_study/alphas_betas.csv"
prices_csv       = "data/curated/paper1/prices/prices_long.csv"
market_csv       = "data/curated/paper1/prices/TOPIX_prices.csv"

[horserace]
skip_if_exists = true
# optional: override which windows horserace runs
# windows = [[0,0],[0,1],[-1,1],[-2,2],[-3,3]]
[horserace.inputs]
panel_csv        = "data/curated/paper1/panel/mdna_summary_nikkei225_with_lmmd.csv"
